<!doctype html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Billetera</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d3d4d9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Billetera">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>Mi Billetera</h1>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar entre modo claro y oscuro">modo</button>
    </div>
    <div class="disponible-line">
      <span class="amt" id="headerDisponible">$ 0</span>
      <span class="lbl">disponible ahora</span>
      <button class="quick-add" id="quickAddIncome" type="button" aria-label="Agregar ingreso">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <main>

    <!-- ===================== RESUMEN ===================== -->
    <section class="tab active" id="tab-resumen">
      <div class="stat-row">
        <div class="stat-card"><div class="k">Disponible</div><div class="v" id="statDisponible">$ 0</div></div>
        <div class="stat-card ahorro"><div class="k">Ahorrado</div><div class="v" id="statAhorro">$ 0</div></div>
        <div class="stat-card debo"><div class="k">Debo</div><div class="v" id="statDebo">$ 0</div></div>
      </div>

      <div class="month-nav">
        <button id="prevMonth" type="button" aria-label="Mes anterior">‹</button>
        <span class="lbl" id="monthLabel">—</span>
        <button id="nextMonth" type="button" aria-label="Mes siguiente">›</button>
      </div>

      <div class="ledger" id="monthLedger"></div>

      <h2 class="section-title">Gastos por categoría</h2>
      <div class="barlist" id="catBarList"></div>

      <h2 class="section-title">Próximos vencimientos</h2>
      <div id="upcomingDebts"></div>
    </section>

    <!-- ===================== MOVIMIENTOS ===================== -->
    <section class="tab" id="tab-movimientos">
      <div class="row-between">
        <h2 class="section-title">Movimientos</h2>
        <button class="pill-btn" id="toggleTxForm" type="button">+ Agregar</button>
      </div>

      <form class="panel" id="txForm">
        <div class="panel-inner">
          <div class="field">
            <label>Tipo</label>
            <div class="seg" id="txTypeSeg">
              <button type="button" data-val="ingreso" class="sel">Ingreso</button>
              <button type="button" data-val="gasto">Gasto</button>
              <button type="button" data-val="ahorro">Ahorro</button>
            </div>
          </div>
          <div class="field" id="ahorroModoField" style="display:none;">
            <label>Movimiento de ahorro</label>
            <div class="seg" id="ahorroModoSeg">
              <button type="button" data-val="deposito" class="sel">Depósito</button>
              <button type="button" data-val="retiro">Retiro</button>
            </div>
          </div>
          <div class="field">
            <label>Monto ($)</label>
            <input type="number" id="txAmount" inputmode="decimal" min="0" step="1" placeholder="0">
          </div>
          <div class="field" id="txCatField" style="display:none;">
            <label>Categoría</label>
            <select id="txCategory"></select>
          </div>
          <div class="field" id="txSubcatField" style="display:none;">
            <label>Subcategoría (opcional)</label>
            <select id="txSubcategory"></select>
          </div>
          <div class="field">
            <label>Fecha</label>
            <input type="date" id="txDate">
          </div>
          <div class="field">
            <label>Descripción (opcional)</label>
            <input type="text" id="txDesc" placeholder="Ej: changuito del super">
          </div>
          <div class="submit-row">
            <button type="submit" class="pill-btn">Guardar movimiento</button>
            <button type="button" class="pill-btn ghost" id="cancelTx">Cancelar</button>
          </div>
        </div>
      </form>

      <div id="txList"></div>
    </section>

    <!-- ===================== DEUDAS ===================== -->
    <section class="tab" id="tab-deudas">
      <div class="row-between">
        <h2 class="section-title">Deudas</h2>
        <button class="pill-btn" id="toggleDebtForm" type="button">+ Agregar</button>
      </div>

      <div id="debtBanner"></div>
      <div id="notifHint"></div>

      <form class="panel" id="debtForm">
        <div class="panel-inner">
          <div class="field">
            <label>¿A quién le debo?</label>
            <input type="text" id="debtName" placeholder="Ej: Mamá, Juan, tarjeta...">
          </div>
          <div class="field">
            <label>Monto ($)</label>
            <input type="number" id="debtAmount" inputmode="decimal" min="0" step="1" placeholder="0">
          </div>
          <div class="field">
            <label>Fecha límite de pago</label>
            <input type="date" id="debtDate">
          </div>
          <div class="field">
            <label>Notas (opcional)</label>
            <textarea id="debtNotes" placeholder="Ej: en 2 cuotas, transferencia..."></textarea>
          </div>
          <div class="submit-row">
            <button type="submit" class="pill-btn">Guardar deuda</button>
            <button type="button" class="pill-btn ghost" id="cancelDebt">Cancelar</button>
          </div>
        </div>
      </form>

      <div id="debtList"></div>
    </section>

    <!-- ===================== CATEGORÍAS ===================== -->
    <section class="tab" id="tab-categorias">
      <div class="row-between">
        <h2 class="section-title">Categorías</h2>
        <button class="pill-btn" id="toggleCatForm" type="button">+ Agregar</button>
      </div>

      <form class="panel" id="catForm">
        <div class="panel-inner">
          <div class="field">
            <label>Nueva categoría</label>
            <input type="text" id="newCatName" placeholder="Ej: Estudio, Salidas...">
          </div>
          <div class="submit-row">
            <button type="submit" class="pill-btn">Crear categoría</button>
            <button type="button" class="pill-btn ghost" id="cancelCat">Cancelar</button>
          </div>
        </div>
      </form>

      <div id="catList"></div>

      <h2 class="section-title">Copia de seguridad</h2>
      <div class="notif-hint"><span>Guardá tus datos en un archivo por si cambiás de celu o borrás el navegador.</span></div>
      <div class="submit-row" style="margin-top:12px;">
        <button type="button" class="pill-btn" id="btnExport">Exportar</button>
        <button type="button" class="pill-btn ghost" id="btnImport">Importar</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    </section>

  </main>
</div>

<nav class="bottom">
  <div class="row">
    <button class="tabbtn active" data-tab="resumen" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V11"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
      Resumen
    </button>
    <button class="tabbtn" data-tab="movimientos" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 8h13"/><path d="M7 8l3-3"/><path d="M7 8l3 3"/><path d="M17 16H4"/><path d="M17 16l-3-3"/><path d="M17 16l-3 3"/></svg>
      Movimientos
    </button>
    <button class="tabbtn" data-tab="deudas" type="button" style="position:relative;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.5V12l3 2"/></svg>
      Deudas
      <span class="badge" id="debtBadge" style="display:none;">0</span>
    </button>
    <button class="tabbtn" data-tab="categorias" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 3.5H5.5a2 2 0 0 0-2 2v7l9.5 9.5a2 2 0 0 0 2.8 0l6.2-6.2a2 2 0 0 0 0-2.8L12.5 3.5Z"/><circle cx="8.2" cy="8.2" r="1.3"/></svg>
      Categorías
    </button>
  </div>
</nav>

<script src="app.js"></script>
</body>
</html>
